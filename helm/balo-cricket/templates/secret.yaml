{{/*
  ⚠️  Secret values are stored as base64-encoded plaintext in etcd.
  Always supply real values via --set or a sealed-secrets / external-secrets
  solution. Never commit live credentials into values.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "balo-cricket.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.secrets.jwtSecret | quote }}
  API_KEY: {{ .Values.api.secrets.apiKey | quote }}
