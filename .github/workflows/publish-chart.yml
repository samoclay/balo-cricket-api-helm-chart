name: Publish Helm Chart

on:
  push:
    branches:
      - master

jobs:
  publish:
    name: Package & Publish Chart
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package Helm chart
        run: |
          mkdir -p docs
          helm package . --destination docs/

      - name: Generate Helm repo index
        run: |
          helm repo index docs/ --url https://samoclay.github.io/balo-cricket-helm-chart

      - name: Commit and push updated docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "docs/ is already up-to-date — nothing to commit."
          else
            git commit -m "chore: publish helm chart to github pages [skip ci]"
            git push
          fi